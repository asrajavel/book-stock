<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookstock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="app std">
  <div id="view"></div>
  <div class="bottom">
    <div class="bar" id="bar" hidden></div>
    <nav class="tabs" style="--n:3">
      <span class="ind"></span>
      <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Stock</button>
      <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>People</button>
      <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
    </nav>
  </div>
</div>
<div class="toast" hidden></div>
<script>
// Mock only: everything lives in memory and resets on reload.
const BOOKS = [
  { id: 1, short: "Gita", lang: "English", price: 250, cover: "bhagavad-gita-as-it-is" },
  { id: 2, short: "Krsna Book", lang: "English", price: 300, cover: "krsna-book" },
  { id: 3, short: "Raja-Vidya", lang: "English", price: 30, cover: "raja-vidya" },
  { id: 4, short: "Beyond Birth and Death", lang: "English", price: 30, cover: "beyond-birth-and-death" },
];
const PEOPLE = ["Temple", "Pannaga", "Rajavel", "Tarun", "Srikanth", "Chaitanya Center"]; // index is the id; Temple and Center have no login
const TEMPLE = 0, CENTER = 5; // the Center is a shelf: it holds books for their owners, never owes anything of its own (no selling there yet)
// Everyone's books sit in piles by whose they are (src): their own, the Temple's (only for whoever took them from the Temple),
// or the volunteer who owns them. A book's owner is the volunteer who brought it in: their own, or taken from the Temple.
// kind: lend (from gives to, out of from's pile src; from a volunteer's pile it is a pass: the new holder owes that owner),
//       return (books back), pay (from pays to for sold books), add (to's own books), out (books from pile src leave: distributed, gifted, lost)
let entries = []; // starts empty: the demo is played from zero
let me = 1, tab = "me", person = null, ptab = "between";

const $ = s => document.querySelector(s);
const rs = n => "₹" + n.toLocaleString("en-IN");
const day = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const today = () => new Date().toLocaleDateString("en-CA"); // local date, YYYY-MM-DD
const B = id => BOOKS.find(b => b.id == id);
const nz = o => Object.entries(o).filter(([, n]) => n);
const pos = o => Object.entries(o).filter(([, n]) => n > 0);
const count = o => pos(o).reduce((t, [, n]) => t + n, 0);
const value = o => pos(o).reduce((t, [id, n]) => t + n * B(id).price, 0); // ponytail: today's price; real app copies the price on the lend day
const nb = n => `${n} book${n == 1 ? "" : "s"}`;
const books = o => pos(o).map(([id, n]) => `${n} ${B(id).short}${B(id).lang == "English" ? "" : " " + B(id).lang}`).join(", ");
const ALL = () => Object.fromEntries(BOOKS.map(b => [b.id, Infinity]));
const sumOf = list => list.reduce((acc, o) => { for (const [k, n] of Object.entries(o)) acc[k] = (acc[k] || 0) + n; return acc; }, {});

// Replays all entries into hold[p][src][book] (p's pile owed to src; src == p is own)
// and loans[a][b][src][book] (b has from a, out of a's pile src).
function state() {
  const hold = {}, loans = {};
  const get = (o, ...k) => k.reduce((x, key) => x[key] ??= {}, o);
  const bump = (o, bk, n) => o[bk] = (o[bk] || 0) + n;
  for (const e of entries) for (const [bk, n] of Object.entries(e.lines)) {
    if (e.kind == "add") bump(get(hold, e.to, e.to), bk, n);
    if (e.kind == "out") bump(get(hold, e.from, e.src), bk, -n);
    if (e.kind == "lend" && e.src != e.from && e.src != TEMPLE) { // pass on someone else's books: the debt moves to the new holder
      bump(get(hold, e.from, e.src), bk, -n); bump(get(hold, e.to, e.src), bk, n);
      const byS = get(loans, e.src, e.from); let left = n;
      for (const s of Object.keys(byS)) { const k = Math.min(left, byS[s][bk] || 0); if (!k) continue; byS[s][bk] -= k; left -= k; bump(get(loans, e.src, e.to, s), bk, k); }
    } else if (e.kind == "lend") { bump(get(hold, e.from, e.src), bk, -n); bump(get(hold, e.to, e.from), bk, n); bump(get(loans, e.from, e.to, e.src), bk, n); }
    if (e.kind == "return" || e.kind == "pay") {
      const byS = get(loans, e.to, e.from); let left = n;
      for (const s of Object.keys(byS)) { // ponytail: settles the lender's piles in id order; real app could go oldest first
        const k = Math.min(left, byS[s][bk] || 0); if (!k) continue;
        byS[s][bk] -= k; left -= k;
        if (e.kind == "return") bump(get(hold, e.to, s), bk, k);
      }
      if (e.kind == "return") bump(get(hold, e.from, e.to), bk, -n); // pay moves no books: only sold books can be paid for
    }
  }
  return { hold, loans };
}
const S = () => state();
const pile = (p, src) => (S().hold[p] || {})[src] || {};
const owedBy = (a, b) => sumOf(Object.values((S().loans[a] || {})[b] || {})); // books b has from a, not yet returned or paid
const onward = (p, src) => Object.entries(S().loans[p] || {}).map(([c, byS]) => [+c, byS[src] || {}]); // p's pile src lent on to c
const others = () => PEOPLE.map((_, i) => i).filter(i => i != me);
const who = p => p == me ? "you" : PEOPLE[p];
const pileName = (holder, src) => src == holder ? "Own" : src == me ? "Yours" : `${PEOPLE[src]}'s`;
const people = () => others().filter(p => p != CENTER);
const pileOrder = holder => ([a], [b]) => (a != holder) - (b != holder) || a - b;

// Where owed books are now: still held, lent on to someone, or sold (their cash is what is owed).
function whereNow(id, n, holder, lender) {
  const held = Math.max(0, Math.min(n, pile(holder, lender)[id] || 0));
  const on = onward(holder, lender).map(([c, o]) => [c, o[id] || 0]).filter(([, k]) => k > 0);
  const sold = n - held - on.reduce((t, [, k]) => t + k, 0);
  return { held, on, sold: Math.max(0, sold) };
}
const heldOf = (holder, lender) => Object.fromEntries(pos(owedBy(lender, holder)).map(([id, n]) => [id, whereNow(id, n, holder, lender).held]));
// Owed books that were sold: only these can be paid for (lent-on ones are paid once that person pays).
const soldOf = (holder, lender) => Object.fromEntries(pos(owedBy(lender, holder)).map(([id, n]) => [id, whereNow(id, n, holder, lender).sold]));
// Owed books in three groups: still held, sold, with others (no action). Either side records:
// the holder sees Return / Pay, the lender sees Take back / Collect cash.
function loanGroups(holder, lender) {
  const owed = pos(owedBy(lender, holder)).map(([id, n]) => [id, whereNow(id, n, holder, lender)]);
  const held = Object.fromEntries(owed.map(([id, w]) => [id, w.held]));
  const sold = Object.fromEntries(owed.map(([id, w]) => [id, w.sold]));
  const on = owed.flatMap(([id, w]) => w.on.map(([c, k]) => [id, c, k]));
  const iHold = holder == me, P = PEOPLE[person];
  const btn = (act, label) => `<button class="btn soft" data-act="${act}">${label}</button>`;
  return [
    count(held) && `<h2>${iHold ? `${P}'s books with you` : `Your books with ${P}`} · ${count(held)}</h2>${bookList(held)}
      <div class="acts">${iHold ? btn("return", "Return") : btn("takeback", "Take back")}</div>`,
    count(sold) && `<h2>${iHold ? "Sold · cash to pay" : `Sold by ${P} · cash to collect`} · ${rs(value(sold))}</h2>${bookList(sold)}
      <div class="acts">${iHold ? btn("pay", "Pay") : btn("collect", "Collect cash")}</div>`,
    on.length && `<h2>With others</h2><ul class="list">${on.map(([id, c, k]) => greyRow(id, k, `With ${who(c)} · ${rs(k * B(id).price)}`)).join("")}</ul>`,
  ].filter(Boolean).join("");
}
const greyRow = (id, n, sub) => `<li class="row grey"><img class="cover" src="covers/${B(id).cover}.webp" alt="">
  <div class="info"><div class="name">${B(id).short} <span class="lang">${B(id).lang}</span></div><div class="sub num">${sub}</div></div>
  <div class="end"><strong class="num">${n}</strong></div></li>`;
const bookRow = (id, n, note = "") => `<li class="row"><img class="cover" src="covers/${B(id).cover}.webp" alt="">
  <div class="info"><div class="name">${B(id).short} <span class="lang">${B(id).lang}</span></div><div class="sub num">${n < 0 ? `<span class="due">Missing an entry</span>` : note + rs(n * B(id).price)}</div></div>
  <div class="end"><strong class="num${n < 0 ? " due" : ""}">${n}</strong></div></li>`;
const bookList = (o, noteFn = () => "") => `<ul class="list">${nz(o).map(([id, n]) => bookRow(id, n, noteFn(id, n))).join("") || `<li class="empty">None</li>`}</ul>`;

function phrase(e) {
  const P = i => PEOPLE[i];
  const amt = rs(value(e.lines));
  if (e.from == CENTER || e.to == CENTER) {
    const whose = e.src == me ? "yours" : e.src == e.from ? "own books" : `${P(e.src)}'s`;
    if (e.kind == "lend" && e.to == CENTER) return e.from == me ? "Put at Center" + (e.src != me ? ` (${P(e.src)}'s)` : "") : `${P(e.from)} put ${whose} at Center`;
    if (e.kind == "lend") return e.to == me ? `Took ${whose} from Center` : `${P(e.to)} took ${whose} from Center`;
    if (e.kind == "return") return e.to == me ? "Took back from Center" : `${P(e.to)} took back from Center`;
  }
  const whose = e.from == me && e.src != null && e.src != me ? ` (${P(e.src)}'s)` : "";
  const pass = e.kind == "lend" && e.src != e.from && e.src != TEMPLE;
  return {
    lend: pass ? (e.from == me ? `Passed ${P(e.src)}'s to ${P(e.to)}` : e.to == me ? `Got ${P(e.src)}'s from ${P(e.from)}` : `${P(e.from)} passed yours to ${P(e.to)}`)
      : (e.from == me ? `Gave ${P(e.to)}` : e.to == me ? `Took from ${P(e.from)}` : `${P(e.from)} gave ${P(e.to)}`) + whose,
    return: e.from == me ? `Returned to ${P(e.to)}` : `${P(e.from)} returned`,
    pay: e.from == me ? `Paid ${P(e.to)} ${amt}` : `${P(e.from)} paid ${amt}`,
    add: "Bought books",
    out: e.from == me ? "Sold" + whose : `${P(e.from)} sold yours`,
  }[e.kind];
}
// Collapsed history for Person and Center pages (the History tab shows it open)
const hist = list => `<details class="hist"><summary><h2>History · ${list.length}</h2></summary>${historyList(list)}</details>`;
const historyList = list => `<ul class="list">${list.slice().reverse().map(e => `<li class="row"><div class="info">
  <div class="name">${day(e.date)} · ${phrase(e)}</div><div class="sub">${books(e.lines)}</div></div></li>`).join("") || `<li class="empty">Nothing yet</li>`}</ul>`;

// Who-owes-whom map: everyone on a circle, an arrow from each person to whoever they owe.
const kRs = n => n >= 1000 ? `₹${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : rs(n);
function owesMap() {
  const W = 360, H = 310, cx = W / 2, cy = 150, R = 118, r = 22;
  const ids = PEOPLE.map((_, i) => i).filter(i => i != CENTER), at = {};
  ids.forEach((p, k) => { const t = -Math.PI / 2 + k * 2 * Math.PI / ids.length; at[p] = [cx + R * Math.cos(t), cy + R * Math.sin(t)]; });
  const edges = [];
  ids.forEach(a => ids.forEach(b => { const v = value(owedBy(a, b)); if (a != b && v) edges.push({ from: b, to: a, v }); }));
  const lines = edges.map(({ from, to, v }) => {
    const [x1, y1] = at[from], [x2, y2] = at[to], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    const [sx, sy, ex, ey] = [x1 + ux * r, y1 + uy * r, x2 - ux * (r + 4), y2 - uy * (r + 4)];
    const qx = (sx + ex) / 2 - uy * 18, qy = (sy + ey) / 2 + ux * 18; // bend right, so A→B and B→A don't overlap
    const lx = (sx + 2 * qx + ex) / 4, ly = (sy + 2 * qy + ey) / 4, mine = from == me || to == me;
    return `<g class="${mine ? "mine" : ""}"><path d="M${sx},${sy} Q${qx},${qy} ${ex},${ey}" marker-end="url(#ah${mine ? "m" : ""})"/>
      <text x="${lx}" y="${ly}" dy="4">${kRs(v)}</text></g>`;
  }).join("");
  const nodes = ids.map(i => [PEOPLE[i], i]).map(([n, i]) => `<g class="node${i == me ? " me" : ""}" ${i == me ? "" : `data-person="${i}" role="button"`} aria-label="${n}">
    <circle cx="${at[i][0]}" cy="${at[i][1]}" r="${r}"/><text x="${at[i][0]}" y="${at[i][1]}" dy="5">${n[0]}</text>
    <text class="nm" x="${at[i][0]}" y="${at[i][1] + r + 14}">${n}</text></g>`).join("");
  return `<svg class="omap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Who pays whom">
    <defs>${["", "m"].map(k => `<marker id="ah${k}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>`).join("")}</defs>
    ${lines}${nodes}</svg><p class="muted cap">Arrow: who pays whom</p>`;
}

function owes(p) {
  if (p == CENTER) {
    const all = sumOf(Object.values(S().hold[CENTER] || {})), mineHere = pile(CENTER, me);
    return [`${nb(count(all))} here`, count(mineHere) && `${count(mineHere)} yours`].filter(Boolean).join(" · ");
  }
  const mine = owedBy(p, me), theirs = owedBy(me, p), s = [];
  if (count(mine)) s.push(`<span class="due">You need to pay ${rs(value(mine))} · ${nb(count(mine))}</span>`);
  if (count(theirs)) s.push(`You need to get ${rs(value(theirs))} · ${nb(count(theirs))}`);
  return s.join("<br>") || "All clear";
}

// A holder's stock: piles in hand, books at the Center, cash in hand from sold books still owed to others
// (own books' money isn't tracked). Shown on My stock and on a person's stock tab.
function stockHtml(h) {
  const mine = Object.entries(S().hold[h] || {}).filter(([, o]) => nz(o).length).sort(pileOrder(h));
  const cash = PEOPLE.map((_, p) => p).filter(p => p != h).map(p => [p, soldOf(h, p)]).filter(([, o]) => count(o));
  const atCenter = pile(CENTER, h);
  const row = (p, o) => `<span class="avatar">${PEOPLE[p][0]}</span><div class="info"><div class="name">For ${p == me ? "you" : PEOPLE[p]}</div><div class="sub">${books(o)}</div></div><div class="end"><strong class="num">${rs(value(o))}</strong></div>`;
  return `<p class="owe">Books in hand · ${mine.reduce((t, [, o]) => t + count(o), 0)}</p>
    ${mine.map(([src, o]) => `<h2>${pileName(h, +src)} · ${nb(count(o))}</h2>${bookList(o)}`).join("") || `<p class="empty">None</p>`}
    ${count(atCenter) ? `<p class="owe">At Chaitanya Center · ${count(atCenter)}</p>${bookList(atCenter)}` : ""}
    <p class="owe">Cash in hand to pay others · ${rs(cash.reduce((t, [, o]) => t + value(o), 0))}</p>
    <ul class="list">${cash.map(([p, o]) => h == me ? `<li><button class="row" data-person="${p}">${row(p, o)}</button></li>` : `<li class="row">${row(p, o)}</li>`).join("") || `<li class="empty">None</li>`}</ul>`;
}
const between = p => count(owedBy(p, me)) || count(owedBy(me, p)); // anything pending between me and p

const VIEWS = {
  me() {
    const iOwe = people().reduce((t, p) => t + value(owedBy(p, me)), 0);
    const owed = people().reduce((t, p) => t + value(owedBy(me, p)), 0);
    return {
      html: `<div class="top"><h1>My stock</h1><button class="round" data-act="who" aria-label="Switch person (mock)">${PEOPLE[me][0]}</button></div>
        <div class="two"><button class="tile" data-tab="people"><span class="muted">Need to pay</span><strong class="num due">${rs(iOwe)}</strong></button>
        <button class="tile" data-tab="people"><span class="muted">Need to get</span><strong class="num">${rs(owed)}</strong></button></div>
        ${stockHtml(me)}`,
      bar: `<button class="btn soft wide" data-act="out">Sell books</button><button class="btn wide" data-act="add">Buy books</button>`,
    };
  },
  people() {
    return { html: `<div class="top"><h1>People</h1></div>${owesMap()}<ul class="list">${others().map(p => `<li><button class="row" data-person="${p}">
      <span class="avatar${p == CENTER ? " sq" : ""}">${PEOPLE[p][0]}</span><div class="info"><div class="name">${PEOPLE[p]}</div><div class="sub">${owes(p)}</div></div></button></li>`).join("")}</ul>` };
  },
  person() {
    const P = PEOPLE[person], mine = owedBy(person, me), theirs = owedBy(me, person), temple = person == TEMPLE;
    const top = `<div class="top"><button class="round" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>${P}</h1></div>`;
    // Volunteers: two tabs. Between us settles in place (Return/Pay or Take back/Collect cash), no bar;
    // their stock tab has Take/Give. The Temple has no stock of its own: one page with Take books.
    const tabs = temple ? "" : `<div class="seg ptabs" role="group">${[["between", "Between us"], ["stock", `${P}'s stock`]]
      .map(([k, l]) => `<button data-ptab="${k}" aria-pressed="${ptab == k}">${l}</button>`).join("")}</div>`;
    if (!temple && ptab == "stock") return {
      html: top + tabs + stockHtml(person),
      bar: `<button class="btn soft wide" data-act="take">Take books</button><button class="btn wide" data-act="give">Give books</button>`,
    };
    return {
      html: `${top}${tabs}
        ${count(mine) ? `<p class="owe due">Need to pay ${P} · ${rs(value(mine))}</p>${loanGroups(me, person)}` : ""}
        ${count(theirs) ? `<p class="owe">Need to get from ${P} · ${rs(value(theirs))}</p>${loanGroups(person, me)}` : ""}
        ${count(mine) || count(theirs) ? "" : `<p class="empty">All clear</p>`}
        ${hist(entries.filter(e => (e.from == me && e.to == person) || (e.from == person && e.to == me)
          || (e.kind == "lend" || e.kind == "out") && ((e.src == me && (e.from == person || e.to == person)) || (e.src == person && (e.from == me || e.to == me)))))}`,
      bar: temple ? `<button class="btn wide" data-act="take">Take books</button>` : "",
    };
  },
  center() {
    const here = Object.entries(S().hold[CENTER] || {}).filter(([, o]) => pos(o).length).sort(pileOrder(me));
    return {
      html: `<div class="top"><button class="round" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Chaitanya Center</h1></div>
        <p class="owe">Books here · ${here.reduce((t, [, o]) => t + count(o), 0)}</p>
        ${here.map(([src, o]) => `<h2>${src == me ? "Yours" : PEOPLE[src] + "'s"} · ${count(o)}</h2>${bookList(o)}`).join("") || `<p class="empty">None</p>`}
        ${hist(entries.filter(e => e.from == CENTER || e.to == CENTER))}`,
      bar: `<button class="btn soft wide" data-act="take">Take books</button><button class="btn wide" data-act="give">Put books</button>`,
    };
  },
  history() {
    return { html: `<div class="top"><h1>History</h1></div>${historyList(entries.filter(e => e.from == me || e.to == me || ((e.kind == "lend" || e.kind == "out") && e.src == me)))}` };
  },
};

// Whose books: one option per pile the holder has books in (the Temple has one endless pile).
const piles = holder => holder == TEMPLE ? [{ src: TEMPLE, label: "", limits: ALL() }]
  : Object.entries(S().hold[holder] || {}).filter(([, o]) => pos(o).length).sort(pileOrder(holder))
    .map(([src, o]) => ({ src: +src, label: pileName(holder, +src), limits: o }));
const one = limits => [{ limits }];
// Each action: picker title, options (piles to choose from) and the entry it saves. Return: books still held; Pay: books sold.
const ACTS = {
  give: () => [person == CENTER ? "Put at Center" : `Give ${PEOPLE[person]}`, piles(me), { kind: "lend", from: me, to: person }],
  take: () => [person == CENTER ? "Take from Center" : `Take from ${PEOPLE[person]}`, piles(person), { kind: "lend", from: person, to: me }],
  return: () => [`Return to ${PEOPLE[person]}`, one(heldOf(me, person)), { kind: "return", from: me, to: person }],
  pay: () => [`Pay ${PEOPLE[person]}`, one(soldOf(me, person)), { kind: "pay", from: me, to: person }],
  takeback: () => [`Take back from ${PEOPLE[person]}`, one(heldOf(person, me)), { kind: "return", from: person, to: me }],
  collect: () => [`Collect cash from ${PEOPLE[person]}`, one(soldOf(person, me)), { kind: "pay", from: person, to: me }],
  add: () => ["Buy books", one(ALL()), { kind: "add", to: me }, "These are books you already own or bought prepaid. These are NOT books purchased on LOAN."],
  out: () => ["Sell books", piles(me), { kind: "out", from: me }, "Books that are sold to public or lost."],
};

function render() {
  const v = VIEWS[person == CENTER ? "center" : person != null ? "person" : tab]();
  $("#view").innerHTML = v.html;
  $("#bar").hidden = !v.bar;
  $("#bar").innerHTML = v.bar || "";
  const i = ["me", "people", "history"].indexOf(tab);
  document.querySelectorAll(".tabs button").forEach((b, j) => j == i ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $(".tabs").style.setProperty("--i", i);
  scrollTo(0, 0);
}

function toast(t) {
  const el = $(".toast");
  el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800);
}

function modal(html) {
  const m = document.createElement("div");
  m.className = "modal std";
  m.innerHTML = `<div class="card">${html}</div>`;
  m.onclick = e => { if (e.target == m || e.target.closest("[data-x]")) m.remove(); };
  document.body.append(m);
  return m;
}

function picker(act) {
  const [title, opts, entry, note] = ACTS[act]();
  let opt = opts[0], q = {};
  const m = modal(`<h3>${title}</h3>${note ? `<p class="muted cap">${note}</p>` : ""}
    ${opts.length > 1 ? `<div class="seg" role="group">${opts.map((o, i) => `<button data-o="${i}" aria-pressed="${!i}">${o.label}</button>`).join("")}</div>` : ""}
    <ul class="list pick"></ul>
    <div class="muted" id="pv">0 books</div>
    <div class="two"><button class="btn soft" data-x>Cancel</button><button class="btn" data-ok disabled>Save</button></div>`);
  const fill = () => {
    q = {};
    m.querySelector(".pick").innerHTML = pos(opt ? opt.limits : {}).map(([id, max]) => `<li class="row" data-id="${id}"><img class="cover" src="covers/${B(id).cover}.webp" alt="">
      <div class="info"><div class="name">${B(id).short} <span class="lang">${B(id).lang}</span></div><div class="sub num">${max < Infinity ? `of ${max} · ` : ""}${rs(B(id).price)}</div></div>
      <div class="step"><button data-d="-1" disabled aria-label="Less">−</button><output>0</output><button class="plus" data-d="1" aria-label="More">+</button></div></li>`).join("") || `<li class="empty">No books</li>`;
    m.querySelector("#pv").textContent = "0 books";
    m.querySelector("[data-ok]").disabled = true;
  };
  fill();
  m.querySelector(".seg")?.addEventListener("click", e => {
    const b = e.target.closest("[data-o]"); if (!b) return;
    opt = opts[+b.dataset.o];
    m.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", x == b));
    fill();
  });
  m.querySelector(".pick").onclick = e => {
    const b = e.target.closest("[data-d]"); if (!b) return;
    const row = b.closest("[data-id]"), id = row.dataset.id, max = opt.limits[id];
    q[id] = Math.max(0, Math.min(max, (q[id] || 0) + +b.dataset.d));
    row.querySelector("output").textContent = q[id];
    row.querySelector("[data-d='-1']").disabled = !q[id];
    row.querySelector("[data-d='1']").disabled = q[id] >= max;
    row.classList.toggle("on", q[id] > 0);
    m.querySelector("#pv").textContent = `${nb(count(q))} · ${rs(value(q))}`;
    m.querySelector("[data-ok]").disabled = !count(q);
  };
  m.querySelector("[data-ok]").onclick = () => {
    const e = { ...entry, ...(opt.src != null && { src: opt.src }), date: today(), lines: Object.fromEntries(pos(q)) };
    if (e.kind == "lend" && e.src == e.to) { e.kind = "return"; delete e.src; } // giving someone their own books back is a return
    entries.push(e);
    const other = e.from == me ? e.to : e.from; // the side that didn't record gets a push (real app)
    m.remove(); render(); toast(`${phrase(e)}: ${books(e.lines)}${other != null && other != TEMPLE && other != CENTER ? ` · ${PEOPLE[other]} notified` : ""}`);
  };
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-person],[data-back],[data-act],[data-ptab]");
  if (!t || t.closest(".modal")) return;
  if (t.dataset.tab) { tab = t.dataset.tab; person = null; }
  else if (t.dataset.person) { person = +t.dataset.person; ptab = between(person) ? "between" : "stock"; }
  else if (t.dataset.ptab) ptab = t.dataset.ptab;
  else if (t.hasAttribute("data-back")) person = null;
  else if (t.dataset.act == "who") {
    const m = modal(`<h3>View as (mock)</h3><ul class="list">${PEOPLE.map((p, i) => i == TEMPLE || i == CENTER ? "" : `<li><button class="row" data-who="${i}"><span class="avatar">${p[0]}</span><div class="info"><div class="name">${p}</div></div></button></li>`).join("")}</ul>`);
    m.querySelector(".list").onclick = ev => { const w = ev.target.closest("[data-who]"); if (w) { me = +w.dataset.who; m.remove(); render(); } };
    return;
  } else return picker(t.dataset.act);
  render();
});
render();
</script>
</body>
</html>
